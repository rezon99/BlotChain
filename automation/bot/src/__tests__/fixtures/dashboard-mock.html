<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BlotChain Mock Dashboard</title>
  <style>
    body {
      background-color: #0f172a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    svg {
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .node {
      animation: breathing 4s ease-in-out infinite alternate;
    }
    @keyframes breathing {
      0% { r: 20px; }
      100% { r: 24px; }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 800 600">
    <!-- Hub Node -->
    <circle cx="400" cy="300" r="40" fill="#3b82f6" opacity="0.8"></circle>
    <!-- Normal Node -->
    <circle class="node" cx="200" cy="150" r="20" fill="#10b981"></circle>
    <circle class="node" cx="600" cy="450" r="20" fill="#ef4444"></circle>
    <!-- Connection lines -->
    <line x1="200" y1="150" x2="400" y2="300" stroke="#475569" stroke-width="2"></line>
    <line x1="600" y1="450" x2="400" y2="300" stroke="#475569" stroke-width="2"></line>
  </svg>
</body>
</html>
